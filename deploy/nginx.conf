# RevenuePilot behind Nginx on a GoDaddy VPS (Ubuntu).
# The React build is served as static files; API, unsubscribe pages and
# health checks are proxied to the Node API on localhost. /ops is never public.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/revenuepilot
#   sudo ln -s /etc/nginx/sites-available/revenuepilot /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d app.example.com      # TLS (adds the 443 server + redirect)
#   sudo nginx -t && sudo systemctl reload nginx
#
# deploy/setup-vps.sh does all of this; replace app.example.com first.
# Postgres (5432) and Redis (6379) listen on 127.0.0.1 only and the firewall
# allows just 22/80/443, so neither is reachable from the internet.

limit_req_zone $binary_remote_addr zone=rp_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=rp_auth:10m rate=10r/m;
# Unauthenticated lead intake (hosted form, signed webhooks).
limit_req_zone $binary_remote_addr zone=rp_public:10m rate=30r/m;

# Access log without query strings (OAuth codes, search text) and without
# unsubscribe tokens in /u/<token> paths.
map $uri $rp_log_uri {
  ~^/u/   /u/[redacted];
  default $uri;
}
log_format rp_safe '$remote_addr - [$time_local] "$request_method $rp_log_uri $server_protocol" '
                   '$status $body_bytes_sent $request_time "$http_user_agent"';

upstream revenuepilot_api {
  server 127.0.0.1:4000;
  keepalive 16;
}

server {
  listen 80;
  server_name app.example.com;

  access_log /var/log/nginx/revenuepilot.access.log rp_safe;
  root /var/www/revenuepilot/apps/web/dist;
  index index.html;
  client_max_body_size 1m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  location /assets/ {
    # Vite emits content-hashed file names.
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /api/auth/login    { limit_req zone=rp_auth burst=5 nodelay; proxy_pass http://revenuepilot_api; include /etc/nginx/proxy_params; }
  location = /api/auth/register { limit_req zone=rp_auth burst=5 nodelay; proxy_pass http://revenuepilot_api; include /etc/nginx/proxy_params; }

  # Live updates (Server-Sent Events): no buffering, long-lived connection.
  location /api/events/ {
    limit_req zone=rp_api burst=20 nodelay;
    proxy_pass http://revenuepilot_api;
    include /etc/nginx/proxy_params;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/public/          { limit_req zone=rp_public burst=10 nodelay; proxy_pass http://revenuepilot_api; include /etc/nginx/proxy_params; }
  location /api/webhooks/leads/  { limit_req zone=rp_public burst=20 nodelay; proxy_pass http://revenuepilot_api; include /etc/nginx/proxy_params; }

  location /api/ {
    limit_req zone=rp_api burst=40 nodelay;
    proxy_pass http://revenuepilot_api;
    include /etc/nginx/proxy_params;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Agent runs call Claude synchronously and can take a while.
    proxy_read_timeout 180s;
  }

  location /u/      { proxy_pass http://revenuepilot_api; include /etc/nginx/proxy_params; }
  location = /readyz { proxy_pass http://revenuepilot_api; include /etc/nginx/proxy_params; }
  location /ops/    { deny all; }

  # Hosted enquiry form: may be embedded in the business's GoDaddy website
  # (iframe), so it gets frame-ancestors instead of X-Frame-Options DENY.
  # add_header in a location replaces the server-level headers, so repeat them.
  location /f/ {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "frame-ancestors *" always;
  }

  # Client-side routes fall back to the SPA.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
